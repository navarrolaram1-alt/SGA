<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/estilos.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <script src="JS/storage.js" defer></script>
        <script src="JS/docentes.js" defer></script>
        <title>SGA</title>
    </head>
    <body>
        <header>
            <h1>Sistema de Gestión Académica</h1>
        </header>
        <main>
            <section class="formulario">
                <h2>Alta de Docentes</h2>
                <form id="formAlumno">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre"><br><br>

                    <label for="materia">Materia</label>
                    <input type="text" id="carrera"><br><br>

                    <label for="correo">Correo electrónico</label>
                    <input type="texto" id="correo"> <br><br>

                    <button type="submit">Guardar Docente</button>
                </form>
                <p id="mensaje" class="oculto"></p>
            </section>
            <section class="docentes">
                <h2>Docentes registrados</h2>
                <p id="cantidadDocentes"></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaDocentes"></tbody>
                </table>
            </section>
        </main>
    </body>
</html>
